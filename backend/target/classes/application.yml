spring:
  application:
    name: codebase-digital-twin

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/digitaltwin}
    username: ${SPRING_DATASOURCE_USERNAME:digitaltwin}
    password: ${SPRING_DATASOURCE_PASSWORD:digitaltwin}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:digitaltwin}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379

server:
  port: 8080

digitaltwin:
  ai:
    base-url: ${AI_PROVIDER_BASE_URL:http://localhost:11434}
    api-key: ${AI_PROVIDER_API_KEY:}
    model: ${AI_PROVIDER_MODEL:llama3}

logging:
  level:
    com.digitaltwin: INFO
